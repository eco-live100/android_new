plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.gms.google-services'

    id 'kotlin-kapt'
    id 'com.google.dagger.hilt.android'
    id 'com.google.firebase.crashlytics'
    id 'com.google.android.libraries.mapsplatform.secrets-gradle-plugin'
}

android {
    compileSdk 34

    defaultConfig {
        applicationId "com.app.ecolive"
        minSdk 23
        targetSdk 33
        versionCode 2
        versionName "1.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true
    }
    dataBinding {
        enabled = true
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

//    compileOptions {
//        sourceCompatibility JavaVersion.VERSION_1_8
//        targetCompatibility JavaVersion.VERSION_1_8
//    }
//    kotlinOptions {
//        jvmTarget = '1.8'
//    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/license.txt', 'META-INF/notice.txt']
        }
    }

    buildFeatures {
        viewBinding true
    }
    namespace 'com.app.ecolive'


}

dependencies {

    // implementation 'androidx.core:core-ktx:1.7.0'
     implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.intuit.ssp:ssp-android:1.1.0'
    implementation 'com.intuit.sdp:sdp-android:1.1.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'de.hdodenhof:circleimageview:3.1.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'

     implementation 'com.squareup.okhttp3:okhttp:5.0.0-alpha.2'

//    implementation platform('com.google.firebase:firebase-bom:30.3.1')


    // Firebase UI
    implementation 'com.firebaseui:firebase-ui-database:1.2.0'
    //Firebase GeoFire
    implementation 'com.firebase:geofire-android:2.3.1'

    //map
    implementation 'com.google.android.gms:play-services-maps:18.2.0'
    //google
     implementation 'com.google.android.libraries.places:places:3.4.0'

    implementation 'com.google.android.gms:play-services-location:21.2.0'
    implementation 'com.google.guava:guava:29.0-android'

    /**Api integration Retrofit**/

    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.11.0'
     implementation 'androidx.core:core-ktx:1.13.1'



    implementation 'com.jakewharton.retrofit:retrofit2-kotlin-coroutines-adapter:0.9.2'
    //otp
    implementation 'com.github.aabhasr1:OtpView:v1.1.2-ktx'


    implementation 'com.android.support:multidex:2.0.1'
    implementation 'com.facebook.shimmer:shimmer:0.5.0'
    implementation 'com.github.mrudultora:Colorpicker:1.2.0'
    implementation 'io.github.g00fy2.quickie:quickie-bundled:1.5.1'



    implementation 'com.akexorcist:google-direction-library:1.2.1'

    implementation 'com.adevinta.android:leku:10.1.0'
    implementation 'com.hbb20:ccp:2.7.0'

    implementation 'com.google.zxing:core:3.4.0'


    // Easy Permissions
    implementation 'pub.devrel:easypermissions:3.0.0'
    // Timber
    implementation 'com.jakewharton.timber:timber:4.7.1'


    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'


    //dagger-hilt
    implementation 'com.google.dagger:hilt-android:2.48.1'
    kapt 'com.google.dagger:hilt-compiler:2.48.1'

    //Round image with radius
    implementation 'com.makeramen:roundedimageview:2.3.0'
    implementation 'com.google.android.flexbox:flexbox:3.0.0'

    implementation 'com.github.ZEGOCLOUD:zego_uikit_prebuilt_call_android:2.14.1'
    implementation 'com.github.ZEGOCLOUD:zego_uikit_signaling_plugin_android:2.4.3'
    implementation 'com.github.ZEGOCLOUD:zego_inapp_chat_uikit_android:2.2.1'
     implementation 'com.github.davidmigloz:number-keyboard:3.0.0'
    implementation 'com.karumi:dexter:6.2.3'
    implementation 'com.github.team-telnyx:telnyx-webrtc-android:1.3.5'
    implementation 'io.github.afreakyelf:Pdf-Viewer:2.1.1'
    implementation "com.google.firebase:firebase-crashlytics:19.0.2"
    implementation "com.google.firebase:firebase-analytics:22.0.2"
 }
kapt {
    correctErrorTypes true
}